<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZITEO — Constructor Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0A0C14;
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app-root { position: relative; }
    #app-root::before {
      content: '';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 500px; height: 700px;
      background: radial-gradient(ellipse, rgba(232,115,58,0.06) 0%, rgba(58,123,213,0.03) 40%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    @keyframes zFadeSlideIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div id="app-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/ios-frame.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/ziteo-ui.jsx"></script>
  <script type="text/babel" src="components/ziteo-dash-shell.jsx"></script>
  <script type="text/babel" src="components/ziteo-dash-home.jsx"></script>
  <script type="text/babel" src="components/ziteo-dash-store.jsx"></script>
  <script type="text/babel" src="components/ziteo-dash-projects.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "orange",
      "navStyle": "pill",
      "showSummary": true
    }/*EDITMODE-END*/;

    function ConstructorDashboard() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [activeTab, setActiveTab] = React.useState('home');
      const [subScreen, setSubScreen] = React.useState(null);

      // Sub-screen navigation
      const handleNavigate = (target) => {
        if (target === 'tienda') { setActiveTab('tienda'); }
        else if (target === 'transporte') { setSubScreen('transporte'); }
        else if (target === 'contratar') { setSubScreen('contratar'); }
        else if (target === 'nuevo-proyecto') { setSubScreen('nuevo-proyecto'); }
      };

      const renderSubScreen = () => {
        switch (subScreen) {
          case 'transporte':
            return <TransportScreen onBack={() => setSubScreen(null)} />;
          case 'contratar':
            return <WorkerSearchScreen onBack={() => setSubScreen(null)} />;
          case 'nuevo-proyecto':
            return <NewProjectForm onBack={() => setSubScreen(null)} />;
          default:
            return null;
        }
      };

      const renderTab = () => {
        switch (activeTab) {
          case 'home': return <HomeTab onNavigate={handleNavigate} />;
          case 'tienda': return <TiendaTab />;
          case 'proyectos': return <ProyectosTab />;
          case 'licitaciones': return <LicitacionesTab />;
          default: return <HomeTab onNavigate={handleNavigate} />;
        }
      };

      return (
        <div style={{ position: 'relative', zIndex: 1 }}>
          <IOSDevice dark={false} width={402} height={874}>
            <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
              {subScreen ? (
                renderSubScreen()
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                  <DashHeader />
                  <div style={{
                    flex: 1, overflowY: 'auto', overflowX: 'hidden',
                    paddingBottom: 90,
                  }}>
                    <div key={activeTab} style={{ animation: 'zFadeSlideIn 0.25s ease' }}>
                      {renderTab()}
                    </div>
                  </div>
                  <DashNav activeTab={activeTab} onTabChange={setActiveTab} />
                  <ChatFab />
                </div>
              )}
            </div>
          </IOSDevice>

          <TweaksPanel title="Tweaks · ZITEO">
            <TweakSection label="Navegación Rápida" />
            <TweakButton label="Home" onClick={() => { setSubScreen(null); setActiveTab('home'); }} secondary />
            <TweakButton label="Tienda" onClick={() => { setSubScreen(null); setActiveTab('tienda'); }} secondary />
            <TweakButton label="Proyectos" onClick={() => { setSubScreen(null); setActiveTab('proyectos'); }} secondary />
            <TweakButton label="Licitaciones" onClick={() => { setSubScreen(null); setActiveTab('licitaciones'); }} secondary />
            <TweakSection label="Sub-pantallas" />
            <TweakButton label="Solicitar Transporte" onClick={() => setSubScreen('transporte')} secondary />
            <TweakButton label="Contratar Maestros" onClick={() => setSubScreen('contratar')} secondary />
            <TweakButton label="Nuevo Proyecto" onClick={() => setSubScreen('nuevo-proyecto')} secondary />
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app-root')).render(<ConstructorDashboard />);
  </script>
</body>
</html>
