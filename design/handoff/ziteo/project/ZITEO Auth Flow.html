<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZITEO — Auth Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0A0C14;
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle ambient glow behind the device */
    #app-root {
      position: relative;
    }
    #app-root::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 500px; height: 700px;
      background: radial-gradient(ellipse, rgba(232,115,58,0.08) 0%, rgba(58,123,213,0.04) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Animations */
    @keyframes zFadeSlideIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes zPulseGlow {
      0%, 100% { box-shadow: 0 8px 32px rgba(232,115,58,0.3); }
      50% { box-shadow: 0 8px 40px rgba(232,115,58,0.5), 0 0 60px rgba(58,123,213,0.15); }
    }

    /* Scrollbar styling for iOS content */
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div id="app-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/ios-frame.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/ziteo-ui.jsx"></script>
  <script type="text/babel" src="components/ziteo-screens.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "blue",
      "cornerRadius": "rounded",
      "buttonStyle": "gradient"
    }/*EDITMODE-END*/;

    function ZiteoApp() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [screen, setScreen] = React.useState('splash');
      const [prevScreen, setPrevScreen] = React.useState(null);

      // Dynamic colors based on tweaks
      const accent = t.accentColor === 'blue' ? Z.blue : Z.orange;
      const accentDark = t.accentColor === 'blue' ? Z.blueDark : Z.orangeDark;

      const navigate = (to) => {
        setPrevScreen(screen);
        setScreen(to);
      };

      // Determine if dark status bar is needed
      const isDarkScreen = ['splash', 'welcome'].includes(screen);

      return (
        <div style={{ position: 'relative', zIndex: 1 }}>
          <IOSDevice dark={isDarkScreen} width={402} height={874}>
            <div style={{ position: 'relative', width: '100%', height: '100%' }}>
              {screen === 'splash' && (
                <SplashScreen onComplete={() => navigate('welcome')} />
              )}
              {screen === 'welcome' && (
                <WelcomeScreen
                  onLogin={() => navigate('login')}
                  onRegister={() => navigate('register')}
                />
              )}
              {screen === 'login' && (
                <LoginScreen
                  onBack={() => navigate('welcome')}
                  onSuccess={() => navigate('profile')}
                  onRegister={() => navigate('register')}
                />
              )}
              {screen === 'register' && (
                <RegisterScreen
                  onBack={() => navigate('welcome')}
                  onSuccess={() => navigate('profile')}
                />
              )}
              {screen === 'profile' && (
                <ProfileScreen
                  onLogout={() => navigate('welcome')}
                  tweaks={t}
                />
              )}
            </div>
          </IOSDevice>

          <TweaksPanel title="Tweaks · ZITEO">
            <TweakSection label="Estilo Visual" />
            <TweakColor
              label="Color de acento"
              value={t.accentColor}
              options={[
                { value: 'orange', label: 'Naranja', color: '#E8733A' },
                { value: 'blue', label: 'Azul', color: '#3A7BD5' },
              ].map(o => o.color)}
              onChange={(v) => setTweak('accentColor', v === '#E8733A' ? 'orange' : 'blue')}
            />
            <TweakRadio
              label="Esquinas"
              value={t.cornerRadius}
              options={['rounded', 'sharp']}
              onChange={(v) => setTweak('cornerRadius', v)}
            />
            <TweakRadio
              label="Botones"
              value={t.buttonStyle}
              options={['solid', 'gradient']}
              onChange={(v) => setTweak('buttonStyle', v)}
            />
            <TweakSection label="Navegación" />
            <TweakButton label="Ir al Splash" onClick={() => navigate('splash')} secondary />
            <TweakButton label="Ir al Welcome" onClick={() => navigate('welcome')} secondary />
            <TweakButton label="Ir al Login" onClick={() => navigate('login')} secondary />
            <TweakButton label="Ir al Registro" onClick={() => navigate('register')} secondary />
            <TweakButton label="Ir al Perfil" onClick={() => navigate('profile')} secondary />
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app-root')).render(<ZiteoApp />);
  </script>
</body>
</html>
