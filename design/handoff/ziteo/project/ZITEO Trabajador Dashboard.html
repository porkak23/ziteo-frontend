<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZITEO — Trabajador Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0A0C14; font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app-root { position: relative; }
    #app-root::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 500px; height: 700px;
      background: radial-gradient(ellipse, rgba(232,115,58,0.07) 0%, rgba(58,123,213,0.03) 40%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    @keyframes zFadeSlideIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="components/ios-frame.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/ziteo-ui.jsx"></script>
  <script type="text/babel" src="components/ziteo-dash-shell.jsx"></script>
  <script type="text/babel" src="components/ziteo-trabajador-tabs.jsx"></script>
  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "startActive": false
    }/*EDITMODE-END*/;

    function TrabajadorDashboard() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [activeTab, setActiveTab] = React.useState('home');

      const tabs = [
        { key: 'home',          label: 'Inicio',      Icon: NavIconHome },
        { key: 'licitaciones',  label: 'Licitaciones', Icon: WNavIconBriefcase },
        { key: 'proyectos',     label: 'Proyectos',   Icon: WNavIconHardhat },
        { key: 'perfil',        label: 'Mi Perfil',   Icon: WNavIconUser },
      ];

      const handleNavigate = (target) => {
        if (['licitaciones', 'proyectos', 'perfil'].includes(target)) setActiveTab(target);
      };

      const renderTab = () => {
        switch (activeTab) {
          case 'home':         return <HomeTabTrabajador onNavigate={handleNavigate} />;
          case 'licitaciones': return <LicitacionesTabTrabajador />;
          case 'proyectos':    return <ProyectosTabTrabajador />;
          case 'perfil':       return <PerfilTabTrabajador />;
          default:             return <HomeTabTrabajador onNavigate={handleNavigate} />;
        }
      };

      return (
        <div style={{ position: 'relative', zIndex: 1 }}>
          <IOSDevice dark={false} width={402} height={874}>
            <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
              <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                <DashHeader />
                <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', paddingBottom: 90 }}>
                  <div key={activeTab} style={{ animation: 'zFadeSlideIn 0.25s ease' }}>
                    {renderTab()}
                  </div>
                </div>
                <RoleDashNav tabs={tabs} activeTab={activeTab} onTabChange={setActiveTab} />
                <ChatFab />
              </div>
            </div>
          </IOSDevice>

          <TweaksPanel title="Tweaks · Trabajador">
            <TweakSection label="Navegación Rápida" />
            <TweakButton label="Inicio" onClick={() => setActiveTab('home')} secondary />
            <TweakButton label="Licitaciones" onClick={() => setActiveTab('licitaciones')} secondary />
            <TweakButton label="Proyectos" onClick={() => setActiveTab('proyectos')} secondary />
            <TweakButton label="Mi Perfil" onClick={() => setActiveTab('perfil')} secondary />
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app-root')).render(<TrabajadorDashboard />);
  </script>
</body>
</html>
