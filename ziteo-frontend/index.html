<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D94F00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ziteo">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Ziteo</title>

    <!-- SEO -->
    <meta name="description" content="Ziteo — La plataforma que construye Bolivia. Compra materiales, contrata maestros y gestiona tus proyectos de construcción.">
    <link rel="canonical" href="https://app.ziteo.bo">

    <!-- Open Graph -->
    <meta property="og:title" content="Ziteo">
    <meta property="og:description" content="La plataforma que construye Bolivia">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://app.ziteo.bo">

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Barlow (headlines) + Figtree (body) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;900&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google Fonts: Manrope (design system) -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Google Fonts: Material Symbols Outlined (icon font used app-wide) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
