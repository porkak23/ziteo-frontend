<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A43700">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ziteoo">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Ziteoo</title>

    <!-- SEO -->
    <meta name="description" content="Ziteoo — La plataforma que construye Bolivia. Compra materiales, contrata maestros y gestiona tus proyectos de construcción.">
    <link rel="canonical" href="https://www.ziteo.company/">

    <!-- Open Graph -->
    <meta property="og:title" content="Ziteoo">
    <meta property="og:description" content="La plataforma que construye Bolivia">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.ziteo.company/">

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Space Grotesk (headlines) + Manrope (body/label) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Google Fonts: Material Symbols Outlined — loaded async so it never blocks FCP.
         Icons only render after the font arrives; they are not part of first text paint. -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"
        rel="stylesheet"
      />
    </noscript>
    <!-- Microsoft Clarity — heatmaps y rage clicks (solo si VITE_CLARITY_ID está definido) -->
    <script>
      var clarityId = '%VITE_CLARITY_ID%';
      if (clarityId && clarityId !== '%VITE_CLARITY_ID%') {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window,document,"clarity","script",clarityId);
      }
    </script>

    <!-- Google Analytics 4 — conversiones (solo si VITE_GA4_ID está definido) -->
    <script>
      var ga4Id = '%VITE_GA4_ID%';
      if (ga4Id && ga4Id !== '%VITE_GA4_ID%') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ga4Id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', ga4Id);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
